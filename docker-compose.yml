services:
  db:
    image: postgres:16-alpine
    container_name: bonne-poire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poire
      POSTGRES_PASSWORD: poire
      POSTGRES_DB: bonne_poire
    ports:
      - "5433:5432"
    volumes:
      - poire_pgdata:/var/lib/postgresql/data
volumes:
  poire_pgdata:
